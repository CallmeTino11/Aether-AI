name: Documentation Check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  doc-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Decision-reference integrity is enforced by validate_decisions.py,
      # which checks that every DEC-XXXX cited anywhere resolves to a real
      # entry in the register (guards against fabricated Decision IDs).
      - name: Verify decision references across docs and code
        run: python3 scripts/validate_decisions.py

      - name: Report documentation freshness
        run: |
          echo "Last update per document:"
          for f in docs/*.md; do
            printf '  %-42s %s\n' "$f" "$(git log -1 --format=%cd --date=short -- "$f")"
          done
