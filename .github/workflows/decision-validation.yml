name: Decision Validation

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate-decisions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Decision Register
        run: python3 scripts/validate_decisions.py
