name: Repository Validation

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Self-tests run FIRST: they prove the validators still fail when they
      # should. A previous inline-shell version printed errors but exited 0,
      # leaving CI green on a broken repo. Never trust an untested validator.
      - name: Validator self-tests
        run: bash scripts/test_validators.sh

      - name: Validate repository structure and links
        run: python3 scripts/validate_repo.py
