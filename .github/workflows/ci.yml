name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  typecheck-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm test

  schema:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
        ports: ['5432:5432']
    steps:
      - uses: actions/checkout@v4
      - name: Apply migrations and verify tenant isolation
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -c 'create database aether;'
          psql -h localhost -U postgres -d aether -c 'create extension if not exists pgcrypto;'
          psql -h localhost -U postgres -d aether -f supabase/tests/00_local_auth_stub.sql
          psql -h localhost -U postgres -d aether -v ON_ERROR_STOP=1 -f supabase/migrations/0001_core_schema.sql
          echo "Migration applied cleanly."
