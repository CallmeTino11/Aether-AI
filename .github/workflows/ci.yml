name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  typecheck-and-test:
    runs-on: ubuntu-latest
    strategy:
      # Tested on the LTS the project targets and the version used during
      # development. A version-specific failure (Node's --test glob support
      # differs across majors) must surface here, not in production.
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm test

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
        ports: ['5432:5432']
    env:
      PGPASSWORD: postgres
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/aether
      # Turns a missing DATABASE_URL into a hard failure instead of 8 silent
      # skips. Without this, a misconfigured connection string would leave this
      # job green while testing nothing (DEC-0008).
      REQUIRE_INTEGRATION: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci

      - name: Apply schema
        run: |
          set -euo pipefail
          psql -h localhost -U postgres -d postgres -c 'create database aether;'
          psql -h localhost -U postgres -d aether -c 'create extension if not exists pgcrypto;'
          psql -h localhost -U postgres -d aether -f supabase/tests/00_local_auth_stub.sql
          for migration in supabase/migrations/*.sql; do
            echo "Applying $migration"
            psql -h localhost -U postgres -d aether -v ON_ERROR_STOP=1 -f "$migration"
          done

      - name: Verify tenant isolation and constraints
        run: |
          set -euo pipefail
          psql -h localhost -U postgres -d aether -f supabase/tests/01_tenant_isolation.sql
          echo "RLS and constraint checks executed."

      - name: Integration tests (persistence, retriever calibration, widget security)
        run: npm run test:integration

      # Run twice. Tests that mutate shared state can pass on a clean database
      # and fail on the second run — exactly what happened with rate-limit
      # counters keyed to a fixed time window. A suite that only passes once is
      # not a suite. (Integration files run serially: they share one database
      # and the notification worker claims from a global queue, so parallel
      # files interfere — see DEC-0018.)
      - name: Integration tests are repeatable
        run: npm run test:integration
